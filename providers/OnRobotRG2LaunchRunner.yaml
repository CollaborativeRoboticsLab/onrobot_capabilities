%YAML 1.1
---
name: OnRobotRG2LaunchRunner
spec_type: provider
spec_version: 1.2
description: "Starts the OnRobot RG2 control software."
implements: onrobot_capabilities/OnRobotRGLaunchRunner
runner: onrobot_control/bringup.launch.py

definition:
  launch_parameters:
    - key: gripper
      value: rg2
    - key: namespace
      value: ""
  launch_readiness:
    action:
      name: "/gripper_command"
      type: control_msgs/action/GripperCommand
      timeout: 60.0